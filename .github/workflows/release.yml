# Builds YADM for Linux, macOS (arm64 + x64) and Windows and publishes a GitHub
# Release with the archives when a v* tag is pushed. Run it manually (Actions →
# Release → Run workflow) to only build and get the archives as artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version $VERSION"
            exit 1
          fi

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build-linux.sh
      - name: Check bundled tools
        run: for t in aria2c yt-dlp deno ffmpeg ffprobe; do test -x "dist/YADM-linux/$t"; done
      - name: Pack
        run: tar -C dist -czf "dist/YADM-${{ needs.version.outputs.version }}-linux-x64.tar.gz" YADM-linux
      - uses: actions/upload-artifact@v7
        with:
          path: dist/YADM-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          archive: false
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build aria2c
        run: ARCHS="$(uname -m)" scripts/build-aria2.sh
      - name: Fetch yt-dlp and Deno
        run: ARCHS="$(uname -m)" scripts/fetch-tools.sh
      - name: Build ffmpeg
        run: ARCHS="$(uname -m)" scripts/build-ffmpeg.sh
      - run: scripts/bundle-macos.sh
      - name: Check bundled tools
        run: for t in aria2c yt-dlp deno ffmpeg ffprobe; do test -x "dist/YADM.app/Contents/MacOS/$t"; done
      - name: Pack
        run: ditto -c -k --keepParent dist/YADM.app "dist/YADM-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/YADM-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: if (-not (Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
      - run: powershell -ExecutionPolicy Bypass -File scripts\bundle-windows.ps1
      - name: Check installer
        run: if (-not (Test-Path "dist\YADM-${{ needs.version.outputs.version }}-windows-x64-setup.exe")) { throw "installer was not built" }
      - name: Check bundled tools
        run: foreach ($t in "aria2c", "yt-dlp", "deno", "ffmpeg", "ffprobe") { if (-not (Test-Path "dist\YADM\$t.exe")) { throw "$t.exe was not bundled" } }
      - uses: actions/upload-artifact@v7
        with:
          path: dist/YADM-${{ needs.version.outputs.version }}-windows-x64.zip
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/YADM-${{ needs.version.outputs.version }}-windows-x64-setup.exe
          archive: false
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
          # Archives were uploaded as-is; keep them packed.
          skip-decompress: true
      - run: ls -l assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "YADM ${{ needs.version.outputs.version }}" \
            --generate-notes
