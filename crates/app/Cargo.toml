[package]
name = "yadm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YADM desktop app"

[[bin]]
name = "yadm"
path = "src/main.rs"

[dependencies]
yadm-core.workspace = true
gpui-kit = "0.9.1"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
schemars = "1"

# Linux uses ksni instead (below): tray-icon needs a GTK event loop there,
# which gpui doesn't run.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.21"

# Linux tray: StatusNotifierItem over D-Bus (KDE, GNOME with the AppIndicator
# extension, Xfce…), no GTK needed. The blocking flavor runs on its own thread.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }

[build-dependencies]
embed-resource = "3"
