[package]
name = "yadm-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "YADM desktop app"

[[bin]]
name = "yadm"
path = "src/main.rs"

[dependencies]
yadm-core.workspace = true
gpui-kit = "0.9.1"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
schemars = "1"

# Linux is left out: tray-icon needs a GTK event loop there, which gpui doesn't
# run, and building it would pull in GTK and appindicator.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
tray-icon = "0.21"

[build-dependencies]
embed-resource = "3"
